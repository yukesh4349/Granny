version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: elderly_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: elderly_ai
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: elderly_redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: elderly_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/elderly_ai?schema=public
      REDIS_URL: redis://redis:6379
      PORT: 4000
    ports:
      - '4000:4000'
    depends_on:
      - postgres
      - redis

  ai-services:
    build:
      context: ./ai-services
      dockerfile: Dockerfile
    container_name: elderly_ai_service
    restart: always
    ports:
      - '8000:8000'
    environment:
      PORT: 8000
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  redis_data:
